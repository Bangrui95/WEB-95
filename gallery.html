        function resolvePath(file) {
            const cleanFile = file.trim();

            if (
                cleanFile.startsWith('Gallery/') ||
                cleanFile.startsWith('/Gallery/') ||
                cleanFile.startsWith('./Gallery/')
            ) {
                return cleanFile;
            }

            return `Gallery/${cleanFile}`;
        }

        function createMediaElement(file) {
            const filePath = resolvePath(file);
            const extension = filePath.split('.').pop().toLowerCase();

            if (['mp4', 'webm', 'mov'].includes(extension)) {
                const video = document.createElement('video');
                video.src = filePath;
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                video.setAttribute('playsinline', '');
                video.setAttribute('preload', 'metadata');
                return video;
            } else {
                const img = document.createElement('img');
                img.src = filePath;
                img.loading = 'lazy';
                img.alt = '';
                return img;
            }
        }

        function renderColumn(columnId, files) {
            const column = document.getElementById(columnId);

            files.forEach(file => {
                const item = document.createElement('div');
                item.className = 'grid-item';

                const media = createMediaElement(file);
                item.appendChild(media);

                column.appendChild(item);
            });
        }

        renderColumn('col-1', columns.col1);
        renderColumn('col-2', columns.col2);
        renderColumn('col-3', columns.col3);
